<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .score, .timer {
            padding: 10px 20px;
            background: #f0f0f0;
            border-radius: 10px;
            font-weight: bold;
        }

        .score {
            color: #667eea;
        }

        .timer {
            color: #e74c3c;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px auto;
            max-width: 450px;
        }

        .hole {
            width: 140px;
            height: 140px;
            background: #8b7355;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s;
        }

        .hole:active {
            transform: scale(0.95);
        }

        .mole {
            width: 100%;
            height: 100%;
            background: #a0522d;
            border-radius: 50%;
            position: absolute;
            bottom: -100%;
            left: 0;
            transition: bottom 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }

        .hole.active .mole {
            bottom: 0;
        }

        .mole::before {
            content: '🐹';
        }

        .hole.golden .mole {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .hole.golden .mole::before {
            content: '✨';
            filter: drop-shadow(0 0 5px gold);
        }

        .hole.bomb .mole {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.8);
        }

        .hole.bomb .mole::before {
            content: '💣';
            filter: drop-shadow(0 0 5px red);
        }

        .hole.clock .mole {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.8);
        }

        .hole.clock .mole::before {
            content: '⏰';
            filter: drop-shadow(0 0 5px cyan);
        }

        .hole.treasure .mole {
            background: linear-gradient(135deg, #f39c12 0%, #f1c40f 100%);
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.9);
            animation: treasureGlow 0.5s infinite alternate;
        }

        .hole.treasure .mole::before {
            content: '🎁';
            filter: drop-shadow(0 0 8px gold);
        }

        @keyframes treasureGlow {
            from { box-shadow: 0 0 30px rgba(241, 196, 15, 0.9); }
            to { box-shadow: 0 0 50px rgba(241, 196, 15, 1); }
        }

        .high-score-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10002;
        }

        .high-score-modal.show {
            display: flex;
        }

        .high-score-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .high-score-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .high-score-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        .high-score-list li {
            padding: 15px;
            margin: 10px 0;
            background: #f0f0f0;
            border-radius: 10px;
            font-size: 1.3em;
            display: flex;
            justify-content: space-between;
        }

        .high-score-list li.gold {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
        }

        .high-score-list li.silver {
            background: linear-gradient(135deg, #C0C0C0 0%, #A0A0A0 100%);
            color: white;
        }

        .high-score-list li.bronze {
            background: linear-gradient(135deg, #CD7F32 0%, #B8860B 100%);
            color: white;
        }

        .name-input-container {
            margin: 20px 0;
        }

        .name-input-container input {
            padding: 10px;
            font-size: 1.2em;
            border: 2px solid #667eea;
            border-radius: 8px;
            width: 80%;
            margin-top: 10px;
        }

        .close-modal-btn {
            padding: 10px 30px;
            font-size: 1.1em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        .close-modal-btn:hover {
            background: #764ba2;
        }

        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10001;
        }

        .countdown-overlay.show {
            display: flex;
        }

        .countdown-number {
            font-size: 10em;
            color: white;
            font-weight: bold;
            animation: countdownPulse 1s ease-out;
        }

        @keyframes countdownPulse {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .combo-display {
            position: fixed;
            top: 80px;
            right: 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px 35px;
            border-radius: 20px;
            font-size: 1.8em;
            font-weight: bold;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            display: none;
            animation: pulse 0.5s infinite alternate;
            border: 3px solid rgba(255, 255, 255, 0.5);
        }

        .combo-display.show {
            display: block;
        }

        .combo-display.mega {
            animation: megaPulse 0.4s infinite alternate;
            font-size: 2.2em;
            background: linear-gradient(135deg, #FA8BFF 0%, #2BD2FF 50%, #2BFF88 100%);
        }

        @keyframes pulse {
            from {
                transform: scale(1);
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            }
            to {
                transform: scale(1.08);
                box-shadow: 0 12px 40px rgba(240, 147, 251, 0.6);
            }
        }

        @keyframes megaPulse {
            from {
                transform: scale(1) rotate(-2deg);
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            }
            to {
                transform: scale(1.12) rotate(2deg);
                box-shadow: 0 15px 50px rgba(43, 210, 255, 0.8);
            }
        }

        .timer {
            color: #e74c3c;
            font-size: 1.8em;
            transition: all 0.3s;
        }

        .timer.warning {
            color: #c0392b;
            animation: timerWarning 0.5s infinite alternate;
            font-size: 2em;
        }

        @keyframes timerWarning {
            from {
                transform: scale(1);
                color: #e74c3c;
            }
            to {
                transform: scale(1.1);
                color: #c0392b;
            }
        }

        .explosion {
            position: absolute;
            font-size: 5em;
            pointer-events: none;
            z-index: 1000;
            animation: explode 0.6s ease-out;
        }

        @keyframes explode {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(1.5) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(2) rotate(360deg);
                opacity: 0;
            }
        }

        .start-button {
            padding: 15px 40px;
            font-size: 1.3em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .start-button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .start-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .game-over {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #fff3cd;
            border-radius: 10px;
            font-size: 1.3em;
            color: #856404;
        }

        .game-over.show {
            display: block;
        }

        .high-score {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .miss {
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .character-selector, .theme-selector, .difficulty-selector {
            margin-bottom: 20px;
        }

        .character-selector label, .theme-selector label, .difficulty-selector label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        .character-buttons, .theme-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .character-btn, .theme-btn {
            padding: 10px 15px;
            font-size: 1.5em;
            border: 2px solid #667eea;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .character-btn:hover, .theme-btn:hover {
            background: #f0f0ff;
            transform: scale(1.05);
        }

        .character-btn.selected, .theme-btn.selected {
            background: #667eea;
            color: white;
            transform: scale(1.1);
        }

        body.theme-forest {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
        }

        body.theme-ocean {
            background: linear-gradient(135deg, #2E3192 0%, #1BFFFF 100%);
        }

        body.theme-space {
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
        }

        .difficulty-selector {
            margin-bottom: 20px;
        }

        .difficulty-selector label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .difficulty-btn {
            padding: 10px 20px;
            font-size: 1em;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .difficulty-btn:hover {
            background: #f0f0ff;
        }

        .difficulty-btn.selected {
            background: #667eea;
            color: white;
        }

        .hammer {
            position: absolute;
            font-size: 4em;
            pointer-events: none;
            z-index: 1000;
            animation: hammerHit 0.5s ease-out;
        }

        @keyframes hammerHit {
            0% {
                transform: rotate(-45deg) translateY(-100px);
                opacity: 0;
            }
            50% {
                transform: rotate(0deg) translateY(0);
                opacity: 1;
            }
            100% {
                transform: rotate(10deg) translateY(20px);
                opacity: 0;
            }
        }

        .miss-indicator {
            position: absolute;
            font-size: 3em;
            pointer-events: none;
            color: #e74c3c;
            font-weight: bold;
            animation: missFloat 0.8s ease-out;
            z-index: 999;
        }

        @keyframes missFloat {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-50px);
                opacity: 0;
            }
        }

        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.3s;
        }

        .celebration-overlay.show {
            display: flex;
        }

        .celebration-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            animation: bounceIn 0.6s;
        }

        .celebration-content h2 {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .celebration-content p {
            font-size: 1.5em;
            color: #333;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .points-popup {
            position: absolute;
            font-size: 2em;
            font-weight: bold;
            pointer-events: none;
            z-index: 999;
            animation: pointsFloat 1s ease-out;
        }

        .points-popup.golden {
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .points-popup.normal {
            color: #2ecc71;
        }

        @keyframes pointsFloat {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-80px);
                opacity: 0;
            }
        }

        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 999;
            font-size: 2em;
        }

        .heart-particle {
            animation: heartFloat 1.5s ease-out forwards;
        }

        @keyframes heartFloat {
            0% {
                transform: translateY(0) scale(0);
                opacity: 1;
            }
            50% {
                transform: translateY(-30px) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-60px) scale(0.5);
                opacity: 0;
            }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .rainbow-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid;
            border-color: red orange yellow green blue indigo violet;
            animation: rainbowPulse 0.6s ease-out;
            pointer-events: none;
            z-index: 998;
        }

        @keyframes rainbowPulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .score-burst {
            position: absolute;
            font-size: 3em;
            font-weight: bold;
            pointer-events: none;
            z-index: 999;
            animation: scoreBurst 0.8s ease-out;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        @keyframes scoreBurst {
            0% {
                transform: scale(0) rotate(-15deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.3) rotate(5deg);
                opacity: 1;
            }
            100% {
                transform: scale(0.8) translateY(-100px) rotate(0deg);
                opacity: 0;
            }
        }

        .points-popup {
            position: absolute;
            font-size: 2.5em;
            font-weight: bold;
            pointer-events: none;
            z-index: 999;
            animation: pointsPopup 1.2s ease-out;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        @keyframes pointsPopup {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }
            20% {
                transform: translateY(-10px) scale(1.3);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔨 Whack-a-Mole 🐹</h1>

        <div class="game-info">
            <div class="score">スコア: <span id="score">0</span></div>
            <div class="timer">残り時間: <span id="timer">30</span>秒</div>
        </div>
        <div class="high-score">ハイスコア: <span id="highScore">0</span></div>

        <div class="character-selector" id="characterSelector">
            <label>キャラクターを選択:</label>
            <div class="character-buttons">
                <button class="character-btn selected" data-character="hamster">🐹 ハムスター</button>
                <button class="character-btn" data-character="cat">🐱 ネコ</button>
                <button class="character-btn" data-character="rabbit">🐰 ウサギ</button>
            </div>
        </div>

        <div class="theme-selector" id="themeSelector">
            <label>背景テーマを選択:</label>
            <div class="theme-buttons">
                <button class="theme-btn selected" data-theme="default">🎨 デフォルト</button>
                <button class="theme-btn" data-theme="forest">🌲 森</button>
                <button class="theme-btn" data-theme="ocean">🌊 海</button>
                <button class="theme-btn" data-theme="space">🌌 宇宙</button>
            </div>
        </div>

        <div class="difficulty-selector" id="difficultySelector">
            <label>難易度を選択:</label>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-difficulty="easy">簡単 🌱</button>
                <button class="difficulty-btn selected" data-difficulty="normal">普通 ⭐</button>
                <button class="difficulty-btn" data-difficulty="hard">難しい 🔥</button>
            </div>
        </div>

        <div class="grid" id="grid">
            <div class="hole" data-index="0"><div class="mole"></div></div>
            <div class="hole" data-index="1"><div class="mole"></div></div>
            <div class="hole" data-index="2"><div class="mole"></div></div>
            <div class="hole" data-index="3"><div class="mole"></div></div>
            <div class="hole" data-index="4"><div class="mole"></div></div>
            <div class="hole" data-index="5"><div class="mole"></div></div>
            <div class="hole" data-index="6"><div class="mole"></div></div>
            <div class="hole" data-index="7"><div class="mole"></div></div>
            <div class="hole" data-index="8"><div class="mole"></div></div>
        </div>

        <button class="start-button" id="startButton">ゲーム開始</button>

        <div class="game-over" id="gameOver">
            ゲーム終了！最終スコア: <span id="finalScore">0</span><br>
            <span id="newHighScore"></span>
        </div>
    </div>

    <div class="celebration-overlay" id="celebrationOverlay">
        <div class="celebration-content">
            <h2>🎉 新記録！やったね！ 🎉</h2>
            <p>おめでとうございます！</p>
            <p>新しいハイスコア: <strong id="celebrationScore">0</strong></p>
        </div>
    </div>

    <div class="combo-display" id="comboDisplay">
        🔥 <span id="comboCount">0</span> COMBO! x<span id="comboMultiplier">1</span>
    </div>

    <div class="countdown-overlay" id="countdownOverlay">
        <div class="countdown-number" id="countdownNumber">3</div>
    </div>

    <div class="high-score-modal" id="highScoreModal">
        <div class="high-score-content">
            <h2>🏆 ハイスコアランキング 🏆</h2>
            <div class="name-input-container" id="nameInputContainer" style="display: none;">
                <p>新記録達成！名前を入力してください：</p>
                <input type="text" id="playerNameInput" maxlength="15" placeholder="プレイヤー名">
            </div>
            <ul class="high-score-list" id="highScoreList">
            </ul>
            <button class="close-modal-btn" id="closeModalBtn">閉じる</button>
        </div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let moleInterval = null;
        let isGameActive = false;
        let currentMoleSpeed = 800;
        let highScore = parseInt(localStorage.getItem('whackAMoleHighScore')) || 0;
        let selectedDifficulty = 'normal';
        let combo = 0;
        let comboMultiplier = 1;
        let comboTimeout = null;
        let selectedCharacter = 'hamster';
        let selectedTheme = 'default';
        let highScores = JSON.parse(localStorage.getItem('whackAMoleHighScores')) || [];

        // 難易度設定
        const difficultySettings = {
            easy: { initialSpeed: 1000, speeds: [1000, 800, 600, 500] },
            normal: { initialSpeed: 800, speeds: [800, 600, 400, 300] },
            hard: { initialSpeed: 600, speeds: [600, 400, 250, 150] }
        };

        // キャラクターマッピング
        const characterEmojis = {
            hamster: '🐹',
            cat: '🐱',
            rabbit: '🐰'
        };

        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const startButton = document.getElementById('startButton');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const highScoreElement = document.getElementById('highScore');
        const newHighScoreElement = document.getElementById('newHighScore');
        const celebrationOverlay = document.getElementById('celebrationOverlay');
        const celebrationScore = document.getElementById('celebrationScore');
        const difficultySelector = document.getElementById('difficultySelector');
        const difficultyButtons = document.querySelectorAll('.difficulty-btn');
        const characterSelector = document.getElementById('characterSelector');
        const characterButtons = document.querySelectorAll('.character-btn');
        const themeSelector = document.getElementById('themeSelector');
        const themeButtons = document.querySelectorAll('.theme-btn');
        const comboDisplay = document.getElementById('comboDisplay');
        const comboCountElement = document.getElementById('comboCount');
        const comboMultiplierElement = document.getElementById('comboMultiplier');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownNumber = document.getElementById('countdownNumber');
        const highScoreModal = document.getElementById('highScoreModal');
        const highScoreList = document.getElementById('highScoreList');
        const nameInputContainer = document.getElementById('nameInputContainer');
        const playerNameInput = document.getElementById('playerNameInput');

        // 効果音を生成する関数
        function playSound(type) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // コンボに応じてピッチを上げる
            const comboPitchMultiplier = 1 + (combo * 0.05);

            switch(type) {
                case 'hit':
                    // 通常ヒット音（爽快な音）- コンボでピッチアップ
                    oscillator.frequency.value = 800 * comboPitchMultiplier;
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                    break;
                case 'golden':
                    // 金色モグラヒット音（キラキラ音）- コンボでピッチアップ
                    oscillator.frequency.value = 1200 * comboPitchMultiplier;
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                    // 2つ目の音を追加
                    setTimeout(() => {
                        const osc2 = audioContext.createOscillator();
                        const gain2 = audioContext.createGain();
                        osc2.connect(gain2);
                        gain2.connect(audioContext.destination);
                        osc2.frequency.value = 1600 * comboPitchMultiplier;
                        osc2.type = 'sine';
                        gain2.gain.setValueAtTime(0.2, audioContext.currentTime);
                        gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                        osc2.start(audioContext.currentTime);
                        osc2.stop(audioContext.currentTime + 0.15);
                    }, 50);
                    break;
                case 'miss':
                    // ミス音（残念な音）
                    oscillator.frequency.value = 200;
                    oscillator.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                    break;
                case 'bomb':
                    // 爆発音
                    oscillator.frequency.value = 100;
                    oscillator.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                    break;
                case 'clock':
                    // 時計ボーナス音（ポジティブな音）
                    oscillator.frequency.value = 1000;
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                    // 2音目
                    setTimeout(() => {
                        const osc2 = audioContext.createOscillator();
                        const gain2 = audioContext.createGain();
                        osc2.connect(gain2);
                        gain2.connect(audioContext.destination);
                        osc2.frequency.value = 1300;
                        osc2.type = 'sine';
                        gain2.gain.setValueAtTime(0.25, audioContext.currentTime);
                        gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.25);
                        osc2.start(audioContext.currentTime);
                        osc2.stop(audioContext.currentTime + 0.25);
                    }, 100);
                    break;
                case 'treasure':
                    // 宝箱音（ファンファーレ風）
                    const frequencies = [523, 659, 784, 1047];
                    frequencies.forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = audioContext.createOscillator();
                            const gain = audioContext.createGain();
                            osc.connect(gain);
                            gain.connect(audioContext.destination);
                            osc.frequency.value = freq;
                            osc.type = 'sine';
                            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                            osc.start(audioContext.currentTime);
                            osc.stop(audioContext.currentTime + 0.2);
                        }, i * 100);
                    });
                    break;
            }
        }

        // コンボを更新
        function updateCombo(isHit) {
            if (isHit) {
                combo++;
                // コンボに応じて倍率を計算（3連続ごとに倍率アップ）
                comboMultiplier = 1 + Math.floor(combo / 3);

                comboCountElement.textContent = combo;
                comboMultiplierElement.textContent = comboMultiplier;

                if (combo >= 3) {
                    comboDisplay.classList.add('show');
                }

                // 6コンボ以上でメガエフェクト
                if (combo >= 6) {
                    comboDisplay.classList.add('mega');
                } else {
                    comboDisplay.classList.remove('mega');
                }

                // コンボタイムアウトをリセット
                if (comboTimeout) {
                    clearTimeout(comboTimeout);
                }
                comboTimeout = setTimeout(() => {
                    resetCombo();
                }, 2000);
            } else {
                resetCombo();
            }
        }

        // コンボをリセット
        function resetCombo() {
            combo = 0;
            comboMultiplier = 1;
            comboDisplay.classList.remove('show');
            if (comboTimeout) {
                clearTimeout(comboTimeout);
                comboTimeout = null;
            }
        }

        // ポイントポップアップを表示（強化版）
        function showPointsPopup(x, y, points, isGolden) {
            const popup = document.createElement('div');
            popup.className = 'points-popup ' + (isGolden ? 'golden' : 'normal');
            popup.textContent = '+' + points;
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';

            // コンボが高いほど大きく表示
            if (combo >= 6) {
                popup.style.fontSize = '3.5em';
                popup.style.color = '#FF1493';
            } else if (combo >= 3) {
                popup.style.fontSize = '3em';
            }

            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1200);
        }

        // ハートパーティクルを生成
        function createHeartParticles(x, y, count = 5) {
            const hearts = ['💖', '💕', '💗', '💓', '💝'];
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'particle heart-particle';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

                const angle = (Math.PI * 2 * i) / count;
                const distance = 30 + Math.random() * 20;
                const offsetX = Math.cos(angle) * distance;
                const offsetY = Math.sin(angle) * distance;

                heart.style.left = (x + offsetX) + 'px';
                heart.style.top = (y + offsetY) + 'px';

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1500);
            }
        }

        // 紙吹雪を生成
        function createConfetti(x, y, count = 30) {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];

            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = x + (Math.random() * 100 - 50) + 'px';
                confetti.style.top = y + 'px';

                const duration = 1.5 + Math.random() * 1.5;
                confetti.style.animation = `confettiFall ${duration}s ease-out forwards`;

                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }

        function showCelebration(newScore) {

        startButton.addEventListener('click', () => {

        holes.forEach(hole => {

        });

        // カウントダウンを表示
        function showCountdown() {
            let count = 3;
            countdownOverlay.classList.add('show');

            function updateCountdown() {
                countdownNumber.textContent = count;
                // アニメーションをリセットするため、クラスを再追加
                countdownNumber.style.animation = 'none';
                setTimeout(() => {
                    countdownNumber.style.animation = 'countdownPulse 1s ease-out';
                }, 10);

                if (count > 0) {
                    count--;
                    setTimeout(updateCountdown, 1000);
                } else {
                    countdownOverlay.classList.remove('show');
                    startGame();
                }
            }

            updateCountdown();
        }

        function startGame() {
            // ゲーム初期化
            score = 0;
            timeLeft = 30;
            isGameActive = true;
            resetCombo();

            // 難易度に応じた初期速度を設定
            const settings = difficultySettings[selectedDifficulty];
            currentMoleSpeed = settings.initialSpeed;

            scoreElement.textContent = score;
            timerElement.textContent = timeLeft;
            startButton.disabled = true;
            difficultySelector.style.opacity = '0.5';
            difficultyButtons.forEach(btn => btn.disabled = true);
            characterSelector.style.opacity = '0.5';
            characterButtons.forEach(btn => btn.disabled = true);
            themeSelector.style.opacity = '0.5';
            themeButtons.forEach(btn => btn.disabled = true);
            gameOverElement.classList.remove('show');
            newHighScoreElement.textContent = '';

            // すべてのモグラを隠す
            holes.forEach(hole => {
                hole.classList.remove('active');
                hole.classList.remove('golden');
                hole.classList.remove('bomb');
                hole.classList.remove('clock');
                hole.classList.remove('treasure');
            });

            // タイマーの警告クラスをリセット
            timerElement.classList.remove('warning');

            // タイマー開始
            gameInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;

                // 残り時間が10秒以下で警告表示
                if (timeLeft <= 10) {
                    timerElement.classList.add('warning');
                } else {
                    timerElement.classList.remove('warning');
                }

                // 残り時間に応じて難易度を上げる（モグラ出現速度を上げる）
                if (timeLeft === 20) {
                    updateMoleSpeed(settings.speeds[1]);
                } else if (timeLeft === 10) {
                    updateMoleSpeed(settings.speeds[2]);
                } else if (timeLeft === 5) {
                    updateMoleSpeed(settings.speeds[3]);
                }

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // モグラ出現開始
            showRandomMole();
        }

        function updateMoleSpeed(newSpeed) {
            currentMoleSpeed = newSpeed;
            if (moleInterval) {
                clearInterval(moleInterval);
            }
            moleInterval = setInterval(showRandomMole, currentMoleSpeed);
        }

        function showRandomMole() {
            if (!isGameActive) return;

            // すべてのモグラを隠す
            holes.forEach(hole => {
                hole.classList.remove('active');
                hole.classList.remove('golden');
                hole.classList.remove('bomb');
                hole.classList.remove('clock');
                hole.classList.remove('treasure');
            });

            // ランダムな穴を選択
            const randomIndex = Math.floor(Math.random() * holes.length);
            const randomHole = holes[randomIndex];

            const rand = Math.random();

            // 15%の確率で爆弾を出現
            if (rand < 0.15) {
                randomHole.classList.add('bomb');
            }
            // 2%の確率で宝箱を出現
            else if (rand < 0.17) {
                randomHole.classList.add('treasure');
            }
            // 5%の確率で時計ボーナスを出現
            else if (rand < 0.22) {
                randomHole.classList.add('clock');
            }
            // 10%の確率で金色のモグラを出現
            else if (rand < 0.32) {
                randomHole.classList.add('golden');
            }

            // モグラを表示
            randomHole.classList.add('active');

            // 0.5〜1.5秒後にモグラを隠す
            const displayTime = Math.random() * 1000 + 500;
            setTimeout(() => {
                randomHole.classList.remove('active');
                randomHole.classList.remove('golden');
                randomHole.classList.remove('bomb');
                randomHole.classList.remove('clock');
                randomHole.classList.remove('treasure');
            }, displayTime);
        }

        function whackMole(e) {
            if (!isGameActive) return;

            const hole = e.currentTarget;
            const rect = hole.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            // ヒット判定を改善 - active クラスを持つ全ての穴をチェック
            if (hole.classList.contains('active')) {
                const isBomb = hole.classList.contains('bomb');
                const isGolden = hole.classList.contains('golden');
                const isClock = hole.classList.contains('clock');
                const isTreasure = hole.classList.contains('treasure');

                if (isBomb) {
                    // 爆弾をクリック（ペナルティ）
                    score = Math.max(0, score - 5);
                    timeLeft = Math.max(0, timeLeft - 3);
                    scoreElement.textContent = score;
                    timerElement.textContent = timeLeft;

                    hole.classList.remove('active');
                    hole.classList.remove('bomb');

                    // 爆発音と爆発アニメーション
                    playSound('bomb');
                    showExplosion(x, y);

                    // コンボをリセット
                    resetCombo();

                    // 爆発エフェクト
                    hole.style.background = '#e74c3c';
                    setTimeout(() => {
                        hole.style.background = '#8b7355';
                    }, 300);
                } else if (isClock) {
                    // 時計ボーナスをクリック
                    timeLeft += 5;
                    score += 3;
                    scoreElement.textContent = score;
                    timerElement.textContent = timeLeft;

                    hole.classList.remove('active');
                    hole.classList.remove('clock');

                    // 時計ボーナス音を鳴らす
                    playSound('clock');

                    // コンボは維持（ボーナスなのでリセットしない）
                    updateCombo(true);

                    // ポイントポップアップを表示
                    const popup = document.createElement('div');
                    popup.className = 'points-popup';
                    popup.style.color = '#3498db';
                    popup.textContent = '+5秒 +3点';
                    popup.style.left = x + 'px';
                    popup.style.top = y + 'px';
                    document.body.appendChild(popup);
                    setTimeout(() => popup.remove(), 1000);

                    // ヒットアニメーション
                    hole.style.background = '#3498db';
                    setTimeout(() => {
                        hole.style.background = '#8b7355';
                    }, 200);
                } else if (isTreasure) {
                    // 宝箱をクリック（大量得点＋時間延長）
                    const treasurePoints = 20;
                    timeLeft += 10;
                    score += treasurePoints;
                    scoreElement.textContent = score;
                    timerElement.textContent = timeLeft;

                    hole.classList.remove('active');
                    hole.classList.remove('treasure');

                    // 宝箱音を鳴らす
                    playSound('treasure');

                    // コンボは維持
                    updateCombo(true);

                    // 紙吹雪と豪華なポップアップ
                    createConfetti(x, y, 50);
                    showScoreBurst(x, y, treasurePoints);

                    const popup = document.createElement('div');
                    popup.className = 'points-popup golden';
                    popup.style.fontSize = '3.5em';
                    popup.textContent = '🎁 +20点 +10秒!';
                    popup.style.left = x + 'px';
                    popup.style.top = y + 'px';
                    document.body.appendChild(popup);
                    setTimeout(() => popup.remove(), 1200);

                    // ヒットアニメーション
                    hole.style.background = '#f39c12';
                    setTimeout(() => {
                        hole.style.background = '#8b7355';
                    }, 200);
                } else {
                    // モグラをヒット
                    const basePoints = isGolden ? 5 : 1;
                    const points = basePoints * comboMultiplier;
                    score += points;
                    scoreElement.textContent = score;
                    hole.classList.remove('active');
                    hole.classList.remove('golden');

                    // 効果音を鳴らす
                    playSound(isGolden ? 'golden' : 'hit');

                    // コンボを更新
                    updateCombo(true);

                    // ハンマーアニメーションとポイントポップアップを表示
                    showHammerAnimation(x, y);
                    showPointsPopup(x, y, points, isGolden);

                    // コンボに応じたエフェクト
                    if (combo >= 3) {
                        // 虹のリングエフェクト
                        showRainbowRing(hole);

                        // ハートパーティクル
                        createHeartParticles(x, y, 5);
                    }

                    // 高コンボまたは高得点で紙吹雪
                    if (combo >= 6 || points >= 10) {
                        createConfetti(x, y, combo >= 9 ? 40 : 30);
                        showScoreBurst(x, y, points);
                    }

                    // ヒットアニメーション
                    hole.style.background = isGolden ? '#FFD700' : '#2ecc71';
                    setTimeout(() => {
                        hole.style.background = '#8b7355';
                    }, 200);
                }
            } else {
                // ミス（モグラがいない穴をクリック）
                score = Math.max(0, score - 1);
                scoreElement.textContent = score;

                // ミス音とミスインジケーターを表示
                playSound('miss');
                showMissIndicator(x, y);

                // コンボをリセット
                resetCombo();

                // ミスアニメーション
                hole.style.background = '#e74c3c';
                hole.classList.add('miss');
                setTimeout(() => {
                    hole.style.background = '#8b7355';
                    hole.classList.remove('miss');
                }, 300);
            }
        }

        function endGame() {
            isGameActive = false;
            clearInterval(gameInterval);
            clearInterval(moleInterval);

            // すべてのモグラを隠す
            holes.forEach(hole => {
                hole.classList.remove('active');
                hole.classList.remove('golden');
                hole.classList.remove('bomb');
                hole.classList.remove('clock');
                hole.classList.remove('treasure');
            });

            // コンボをリセット
            resetCombo();

            // タイマーの警告クラスをリセット
            timerElement.classList.remove('warning');

            // 難易度選択ボタンを再度有効化
            difficultySelector.style.opacity = '1';
            difficultyButtons.forEach(btn => btn.disabled = false);
            characterSelector.style.opacity = '1';
            characterButtons.forEach(btn => btn.disabled = false);
            themeSelector.style.opacity = '1';
            themeButtons.forEach(btn => btn.disabled = false);

            // ハイスコアの更新とリスト確認
            const isTopScore = highScores.length < 3 || score > highScores[highScores.length > 2 ? 2 : highScores.length - 1].score;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('whackAMoleHighScore', highScore);
                highScoreElement.textContent = highScore;
                newHighScoreElement.textContent = '🎉 新記録達成！';

                // 祝福アニメーションを表示
                showCelebration(highScore);
            }

            // 結果表示
            finalScoreElement.textContent = score;
            gameOverElement.classList.add('show');
            startButton.disabled = false;

            // トップ3に入った場合はハイスコアモーダルを表示
            if (isTopScore) {
                setTimeout(() => displayHighScores(true), 2000);
            }
        }
    </script>
</body>
</html>
