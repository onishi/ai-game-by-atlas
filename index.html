<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .score, .timer {
            padding: 10px 20px;
            background: #f0f0f0;
            border-radius: 10px;
            font-weight: bold;
        }

        .score {
            color: #667eea;
        }

        .timer {
            color: #e74c3c;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px auto;
            max-width: 450px;
        }

        .hole {
            width: 140px;
            height: 140px;
            background: #8b7355;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s;
        }

        .hole:active {
            transform: scale(0.95);
        }

        .mole {
            width: 100%;
            height: 100%;
            background: #a0522d;
            border-radius: 50%;
            position: absolute;
            bottom: -100%;
            left: 0;
            transition: bottom 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }

        .hole.active .mole {
            bottom: 0;
        }

        .mole::before {
            content: '🐹';
        }

        .start-button {
            padding: 15px 40px;
            font-size: 1.3em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .start-button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .start-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .game-over {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #fff3cd;
            border-radius: 10px;
            font-size: 1.3em;
            color: #856404;
        }

        .game-over.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔨 Whack-a-Mole 🐹</h1>

        <div class="game-info">
            <div class="score">スコア: <span id="score">0</span></div>
            <div class="timer">残り時間: <span id="timer">30</span>秒</div>
        </div>

        <div class="grid" id="grid">
            <div class="hole" data-index="0"><div class="mole"></div></div>
            <div class="hole" data-index="1"><div class="mole"></div></div>
            <div class="hole" data-index="2"><div class="mole"></div></div>
            <div class="hole" data-index="3"><div class="mole"></div></div>
            <div class="hole" data-index="4"><div class="mole"></div></div>
            <div class="hole" data-index="5"><div class="mole"></div></div>
            <div class="hole" data-index="6"><div class="mole"></div></div>
            <div class="hole" data-index="7"><div class="mole"></div></div>
            <div class="hole" data-index="8"><div class="mole"></div></div>
        </div>

        <button class="start-button" id="startButton">ゲーム開始</button>

        <div class="game-over" id="gameOver">
            ゲーム終了！最終スコア: <span id="finalScore">0</span>
        </div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let moleInterval = null;
        let isGameActive = false;

        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const startButton = document.getElementById('startButton');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const holes = document.querySelectorAll('.hole');

        // スタートボタンのクリックイベント
        startButton.addEventListener('click', startGame);

        // 各穴のクリックイベント
        holes.forEach(hole => {
            hole.addEventListener('click', whackMole);
        });

        function startGame() {
            // ゲーム初期化
            score = 0;
            timeLeft = 30;
            isGameActive = true;
            scoreElement.textContent = score;
            timerElement.textContent = timeLeft;
            startButton.disabled = true;
            gameOverElement.classList.remove('show');

            // すべてのモグラを隠す
            holes.forEach(hole => hole.classList.remove('active'));

            // タイマー開始
            gameInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // モグラ出現開始
            moleInterval = setInterval(showRandomMole, 800);
        }

        function showRandomMole() {
            if (!isGameActive) return;

            // すべてのモグラを隠す
            holes.forEach(hole => hole.classList.remove('active'));

            // ランダムな穴を選択
            const randomIndex = Math.floor(Math.random() * holes.length);
            const randomHole = holes[randomIndex];

            // モグラを表示
            randomHole.classList.add('active');

            // 0.5〜1.5秒後にモグラを隠す
            const displayTime = Math.random() * 1000 + 500;
            setTimeout(() => {
                randomHole.classList.remove('active');
            }, displayTime);
        }

        function whackMole(e) {
            if (!isGameActive) return;

            const hole = e.currentTarget;

            if (hole.classList.contains('active')) {
                score++;
                scoreElement.textContent = score;
                hole.classList.remove('active');

                // ヒットアニメーション
                hole.style.background = '#2ecc71';
                setTimeout(() => {
                    hole.style.background = '#8b7355';
                }, 200);
            }
        }

        function endGame() {
            isGameActive = false;
            clearInterval(gameInterval);
            clearInterval(moleInterval);

            // すべてのモグラを隠す
            holes.forEach(hole => hole.classList.remove('active'));

            // 結果表示
            finalScoreElement.textContent = score;
            gameOverElement.classList.add('show');
            startButton.disabled = false;
        }
    </script>
</body>
</html>
